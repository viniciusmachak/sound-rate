<div class="star-container">
  @for (star of stars; track star) {
    <button mat-icon-button [disabled]="readonly" (click)="rate(star, $event)"
      (mousemove)="setHoverRating(star, $event)" (mouseleave)="clearHoverRating()">
      <mat-icon>{{ getStarIcon(star) }}</mat-icon>
    </button>
  }
</div>
