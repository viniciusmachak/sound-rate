<div class="page-container">
  <h1>Listen Later</h1>
  <p class="page-subtitle">Albums you saved to explore</p>

  @if (isLoading) {
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }

  @if (!isLoading) {
    <div>
      @if ((albums$ | async); as albums) {
        <div class="album-grid">
          @for (album of albums; track album) {
            <app-album-card [album]="album"></app-album-card>
          }
        </div>
      } @else {
        <p class="info-message">Your listen later list is empty</p>
      }
      @if (totalAlbums > pageSize) {
        <mat-paginator [length]="totalAlbums" [pageSize]="pageSize"
          [pageIndex]="currentPage" (page)="onPageChange($event)">
        </mat-paginator>
      }
    </div>
  }
</div>
